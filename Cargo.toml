[package]
name = "verified-exec"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Owned verified-before-resume process execution on Darwin"
publish = false

[dependencies]
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
